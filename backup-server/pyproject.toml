[project]
name = "ai-kuguan-backup-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
kuguan-backup = "backup_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backup_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: large streaming disk boundary tests"]
